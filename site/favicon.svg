<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#312E81" /><stop offset="55%" stop-color="#1E1B4B" /><stop offset="100%" stop-color="#172554" /></linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#818CF8" stop-opacity="0.45" /><stop offset="100%" stop-color="#818CF8" stop-opacity="0" /></radialGradient>

    <!-- 3D Car Body Gradient -->
    <linearGradient id="car-metal" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#93C5FD" /><stop offset="50%" stop-color="#818CF8" /><stop offset="100%" stop-color="#A78BFA" /></linearGradient>

    <!-- 3D Car Extrusion (Bottom Lip) -->
    <linearGradient id="car-3d-lip" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#4C1D95" /><stop offset="100%" stop-color="#1E1B4B" /></linearGradient>

    <!-- Windshield Glass Gradient -->
    <linearGradient id="windshield-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Neon Wi-Fi Gradient -->
    <linearGradient id="wifi-neon" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#BFDBFE" /><stop offset="100%" stop-color="#DDD6FE" /></linearGradient>

    <!-- 3D Drop Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#C4B5FD" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg-dark)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />
  <circle cx="256" cy="240" r="220" fill="url(#ambient-glow)" />

  <!-- Ground Shadow under Car -->
  <ellipse cx="256" cy="435" rx="155" ry="18" fill="#000000" opacity="0.55" />

  <!-- Scaled & Centered Icon Group -->
  <g transform="translate(89.6, 142) scale(0.65)">
    
    <!-- Glowing Wi-Fi Waves -->
    <g fill="none" stroke="url(#wifi-neon)" stroke-linecap="round" filter="url(#neon-glow)">
      <path d="M 195 -20 A 115 115 0 0 1 317 -20" stroke-width="26" />
      <path d="M 148 -68 A 180 180 0 0 1 364 -68" stroke-width="26" opacity="0.85" />
      <path d="M 100 -116 A 245 245 0 0 1 412 -116" stroke-width="26" opacity="0.55" />
    </g>

    <!-- 3D Extruded Car Layer (Shifted down 16px for 3D depth) -->
    <path transform="translate(0, 16)" fill="url(#car-3d-lip)" filter="url(#drop-shadow)" d="M39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32l181.2 0c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2l0 192c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32l0-32-320 0 0 32c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32L0 256c0-26.7 16.4-49.6 39.6-59.2z" />

    <!-- Main 3D Car Body -->
    <path fill="url(#car-metal)" d="M39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32l181.2 0c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2l0 192c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32l0-32-320 0 0 32c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32L0 256c0-26.7 16.4-49.6 39.6-59.2z" />

    <!-- Dark Glass Windshield + Diagonal Gloss Reflection -->
    <path fill="url(#windshield-glass)" d="M135.2 117.4l-26.1 74.6 293.8 0-26.1-74.6C372.3 104.6 360.2 96 346.6 96L165.4 96c-13.6 0-25.7 8.6-30.2 21.4z" />
    <path fill="#ffffff" opacity="0.12" d="M165.4 96L265 96L210 192L109.1 192L135.2 117.4C139.7 104.6 151.8 96 165.4 96z" />

    <!-- Glowing LED Headlights -->
    <circle cx="96" cy="304" r="32" fill="#FFFFFF" filter="url(#neon-glow)" />
    <circle cx="96" cy="304" r="20" fill="#FFFFFF" />
    <circle cx="416" cy="304" r="32" fill="#FFFFFF" filter="url(#neon-glow)" />
    <circle cx="416" cy="304" r="20" fill="#FFFFFF" />

    <!-- Subtle Front Grille Pill for Extra Realism -->
    <rect x="176" y="288" width="160" height="32" rx="16" fill="#334155" opacity="0.7" />
  </g>
</svg>